name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-21-jdk-headless ripgrep

      - name: Verify tools
        run: |
          rg --version
          jar --version || true
          unzip -v | head -1

      - name: Run tests
        run: bats tests/
        env:
          TERM: xterm
